# @package _global_
# Knowledge distillation: the whole image goes in, a frozen teacher's per-voxel features are the
# targets, and the student regresses onto them. No cropper and no masker, so the student and the
# teacher encode the same pixels and every pixel is scored.

# `model.terms.distill.checkpoint`: set it to a wcfm checkpoint an earlier run wrote.
# NOTE: the checkpoint must have been generated by wcfm, it carries internally
# the reference to the backbone architecture it ran on (which must have been defined)

defaults:
  - /model/module@model: ssl
  - /model/backbone: attn_mae
  - /model/teacher: none
  - /model/augment: none
  - /model/normalize: log
  - /model/term@model.terms.distill: distill
  - _self_
