# The 2M mixed training set: fdhd_sparse_numu_training (runs 13717-13826, ~1.01M events) and
# fdhd_sparse_nue_training (runs 016898-016907, ~1.0M events), APA 0 / view W, shuffled
# together into shards of 4000 by `wcfm.data.prep.create_shards`.
#
# Training only. The shards carry event-level truth (flavour, CC/NC, energy, vertex) and no
# per-pixel labels, so `data.return_pixel_truth=true` fails here; evaluation stays on the
# 200k set, whose runs are disjoint from these. Everything not stated is the DataConfig
# default: buffer_size 3000, the production geometry and the log normalisation.
backend: sharded
sharded_dir: /gpfs01/lbne/users/fm/cffm-data/shards_fdhd_sparse_2M_mixed_apa0W
global_batch_size: 100
