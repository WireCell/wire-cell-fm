# @package _global_
#
# `polarmae_200k_b80k` at the exposure of the DINO arms, 10M events: four ranks at per-rank
# batch 16 (global 64), 42 epochs. The sharded reader levels its 20 readers (4 ranks x 5
# workers) to 3 of the 50 shards each, so an epoch is 60 shards, 240,000 events, 3,750
# optimizer steps; 42 epochs are 157,500 steps and 10.08M events. Changing `launch.devices`
# or `run.num_workers` on a resume changes the epoch length and shifts every schedule.
#
# The learning rate stays at the reference's batch-16 value: 9.9e-5 at batch 32 and 1.7e-4
# at batch 96 both lost the token rank, 7e-5 at batch 96 held it over 5,000 steps.
#
#   env WCFM_PYENV=<venv> WCFM_REQUEST_MEMORY=48000 WCFM_REQUEST_CPUS=20 wcfm submit +experiment=polarmae_200k_10M
#
# Everything not set below comes from polarmae_200k_b80k.

defaults:
  - polarmae_200k_b80k
  - _self_

run:
  name: wcfm_polarmae_200k_10M
  save_every: 3

launch:
  devices: 4

data:
  global_batch_size: 64   # per-rank 16 on four ranks

optim:
  epochs: 42
  schedules:
    lr:
      warmup_epochs: 0.54   # 2000 steps of 3,750 per epoch
