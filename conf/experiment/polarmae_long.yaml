# @package _global_
#
# PoLAr-MAE trained on its own, the long run: `polarmae_short` at the exposure of the DINO
# arms, 10M events: four ranks at per-rank batch 16 (global 64), 42 epochs. The sharded reader levels its 20 readers (4 ranks x 5
# workers) to 3 of the 50 shards each, so an epoch is 60 shards, 240,000 events, 3,750
# optimizer steps; 42 epochs are 157,500 steps and 10.08M events. Changing `launch.devices`
# or `run.num_workers` on a resume changes the epoch length and shifts every schedule.
#
# The peak learning rate is 3.5e-5, half the reference's 7e-5. This recipe still degrades: the
# median gradient norm rises from ~0.3 at step ~60,000 to the clip value 3.0, the token norm
# doubles between 64,000 and 76,000 and the Chamfer loss bottoms at ~65,000 (epoch 17). At 7e-5
# the same sequence starts at ~48,000. Read `checkpoint_epoch15.pt`, the last before the rise,
# and watch the median gradient norm: it leads the token-rank fall by ~20,000 steps.
#
#   env WCFM_PYENV=<venv> WCFM_REQUEST_MEMORY=48000 WCFM_REQUEST_CPUS=20 \
#     wcfm submit +experiment=polarmae_long
#
# Everything not set below comes from polarmae_short.

defaults:
  - polarmae_short
  - _self_

run:
  name: wcfm_polarmae_200k_10M_lr35
  save_every: 3

launch:
  devices: 4

data:
  global_batch_size: 64   # per-rank 16 on four ranks

optim:
  epochs: 42
  lr: 3.5e-5
  schedules:
    lr:
      warmup_epochs: 0.54   # 2000 steps of 3,750 per epoch
